server:
  port: 8087

spring:
  application:
    name: service-ai

# Cấu hình Gemini (khóa API lấy từ biến môi trường GEMINI_API_KEY)
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  base-url: https://generativelanguage.googleapis.com/v1beta

# Cấu hình chatbot
ai:
  shop-name: DuongTech
  shop-desc: "cửa hàng laptop và thiết bị công nghệ"
  product-domain: "laptop và thiết bị công nghệ"
  use-product-context: true
  # Số sản phẩm gửi kèm cho trợ lý ảo. Phải đủ lớn để phủ hết hàng đang bán (187 máy),
  # nếu không trợ lý chỉ nhìn thấy mấy chục sản phẩm đầu bảng và sẽ trả lời rằng
  # cửa hàng không có những mẫu nằm ngoài khoảng đó.
  max-products: 250

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# Logging
logging:
  level:
    com.duongtech.ai: DEBUG
  pattern:
    console: "[%d{yyyy-MM-dd HH:mm:ss}] [%level] [AI-SERVICE] %msg%n"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
