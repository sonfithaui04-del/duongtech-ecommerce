services:
  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: duong-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "6672:5672"
      - "16672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - duongtech-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Eureka Server
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: duong-eureka-server
    ports:
      - "9761:8761"
    networks:
      - duongtech-network

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: duong-api-gateway
    ports:
      - "9080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - duongtech-network

  # Auth Service
  postgres-auth:
    image: postgres:15-alpine
    container_name: duong-postgres-auth
    environment:
      POSTGRES_DB: duongtech_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 10112004
    ports:
      - "6438:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    networks:
      - duongtech-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  service-auth:
    build:
      context: ./service-auth
      dockerfile: Dockerfile
    container_name: duong-service-auth
    ports:
      - "9081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/duongtech_auth
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 10112004
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      postgres-auth:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - duongtech-network

  # Product Service
  postgres-product:
    image: postgres:15-alpine
    container_name: duong-postgres-product
    environment:
      POSTGRES_DB: duongtech_product
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 10112004
    ports:
      - "6433:5432"
    volumes:
      - postgres-product-data:/var/lib/postgresql/data
    networks:
      - duongtech-network

  service-product:
    build:
      context: ./service-product
      dockerfile: Dockerfile
    container_name: duong-service-product
    ports:
      - "9082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-product:5432/duongtech_product
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 10112004
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - postgres-product
      - eureka-server
    networks:
      - duongtech-network

  # Order Service
  postgres-order:
    image: postgres:15-alpine
    container_name: duong-postgres-order
    environment:
      POSTGRES_DB: duongtech_order
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 10112004
    ports:
      - "6434:5432"
    volumes:
      - postgres-order-data:/var/lib/postgresql/data
    networks:
      - duongtech-network

  service-order:
    build:
      context: ./service-order
      dockerfile: Dockerfile
    container_name: duong-service-order
    ports:
      - "9083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-order:5432/duongtech_order
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 10112004
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - postgres-order
      - rabbitmq
      - eureka-server
    networks:
      - duongtech-network

  # Payment Service
  postgres-payment:
    image: postgres:15-alpine
    container_name: duong-postgres-payment
    environment:
      POSTGRES_DB: duongtech_payment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 10112004
    ports:
      - "6435:5432"
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data
    networks:
      - duongtech-network

  service-payment:
    build:
      context: ./service-payment
      dockerfile: Dockerfile
    container_name: duong-service-payment
    ports:
      - "9084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-payment:5432/duongtech_payment
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 10112004
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SEPAY_BANK_ACCOUNT_NUMBER: "YOUR_ACCOUNT_NUMBER"
      SEPAY_BANK_CODE: "YOUR_BANK_CODE"
      SEPAY_ACCOUNT_NAME: "YOUR_ACCOUNT_NAME"
    depends_on:
      - postgres-payment
      - eureka-server
    networks:
      - duongtech-network

  # Inventory Service
  postgres-inventory:
    image: postgres:15-alpine
    container_name: duong-postgres-inventory
    environment:
      POSTGRES_DB: duongtech_inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 10112004
    ports:
      - "6436:5432"
    volumes:
      - postgres-inventory-data:/var/lib/postgresql/data
    networks:
      - duongtech-network

  service-inventory:
    build:
      context: ./service-inventory
      dockerfile: Dockerfile
    container_name: duong-service-inventory
    ports:
      - "9085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-inventory:5432/duongtech_inventory
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 10112004
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - postgres-inventory
      - rabbitmq
      - eureka-server
    networks:
      - duongtech-network

  # Notification Service
  postgres-notification:
    image: postgres:15-alpine
    container_name: duong-postgres-notification
    environment:
      POSTGRES_DB: duongtech_notification
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 10112004
    ports:
      - "6437:5432"
    volumes:
      - postgres-notification-data:/var/lib/postgresql/data
    networks:
      - duongtech-network

  service-socket:
    build: ./service-socket
    container_name: duong-service-socket
    ports:
      - "9089:8089"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
      - rabbitmq
    networks:
      - duongtech-network

  service-notification:
    build:
      context: ./service-notification
      dockerfile: Dockerfile
    container_name: duong-service-notification
    ports:
      - "9086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notification:5432/duongtech_notification
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 10112004
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - postgres-notification
      - rabbitmq
      - eureka-server
    networks:
      - duongtech-network

  # AI Service (Chatbot tư vấn sản phẩm)
  service-ai:
    build:
      context: ./service-ai
      dockerfile: Dockerfile
    container_name: duong-service-ai
    ports:
      - "9087:8087"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - duongtech-network

volumes:
  postgres-auth-data:
  postgres-product-data:
  postgres-order-data:
  postgres-payment-data:
  postgres-inventory-data:
  postgres-notification-data:
  rabbitmq-data:

networks:
  duongtech-network:
    driver: bridge
